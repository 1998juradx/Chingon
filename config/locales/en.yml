    submit_button: "Enviar"
    todays_cashbox: "Caja del Día"

  # -------------------- BOTONES --------------------
  buttons:
    submit: "Guardar" # O "Enviar" dependiendo del contexto
    filter: "Filtrar"
    cancel: "Cancelar"
    new: "Nuevo"
    edit: "Editar"
    delete: "Eliminar"
    back: "Volver"
    sign_in: "Iniciar Sesión" # Para el botón de login

  # -------------------- TRADUCCIONES PARA EL DASHBOARD PERSONALIZADO --------------------
  active_admin_custom:
    panels:
      date_range_selector: "Seleccionar Rango de Fechas"
      sales: "Ventas Totales"
      clients: "Clientes Atendidos" # O "Pedidos Únicos"
      tacos: "Tacos Vendidos" # Sé específico si puedes
      broths: "Caldos Vendidos"
      beers: "Cervezas Vendidas"
      sodas: "Refrescos Vendidos"
      general_settings: "Ajustes Generales"
    labels:
      date_1: "Desde: "
      date_2: "Hasta: "

  # -------------------- FORMATOS DE FECHA Y HORA --------------------
  date:
    formats:
      default: "%d/%m/%Y" # dd/mm/yyyy
      short: "%d de %b"   # ej. 28 de may
      long: "%A, %d de %B de %Y" # ej. Miércoles, 28 de Mayo de 2025
    day_names: [Domingo, Lunes, Martes, Miércoles, Jueves, Viernes, Sábado]
    abbr_day_names: [Dom, Lun, Mar, Mié, Jue, Vie, Sáb]
    month_names: [~, Enero, Febrero, Marzo, Abril, Mayo, Junio, Julio, Agosto, Septiembre, Octubre, Noviembre, Diciembre]
    abbr_month_names: [~, Ene, Feb, Mar, Abr, May, Jun, Jul, Ago, Sep, Oct, Nov, Dic]
    order: # Para selectores de fecha
      - :day
      - :month
      - :year

  time:
    formats:
      default: "%d/%m/%Y %H:%M"
      short: "%d de %b %H:%M"
      long: "%A, %d de %B de %Y, %H:%M:%S %Z"
    am: "am"
    pm: "pm"

  # Para números, monedas, etc.
  number:
    format:
      separator: "." # Separador de miles
      delimiter: "," # Separador decimal
      precision: 2
      significant: false
      strip_insignificant_zeros: false
    currency:
      format:
        format: "%n %u" # o "%u%n"
        unit: "MXN" # O tu moneda local, ej: "$"
        separator: "."
        delimiter: ","
        precision: 2
        significant: false
        strip_insignificant_zeros: false
    percentage:
      format:
        delimiter: ""
        precision: 2
    precision:
      format:
        delimiter: ""

  # Otros textos comunes
  helpers:
    select:
      prompt: "Por favor seleccione"
    submit:
      create: 'Crear %{model}'
      update: 'Actualizar %{model}'
      submit: 'Guardar %{model}'

  # Para errores de validación
  errors:
    format: "%{attribute} %{message}"
    messages:
      accepted: "debe ser aceptado"
      blank: "no puede estar en blanco"
      # ... (puedes encontrar la lista completa en la guía de i18n de Rails)